name: Web Dashboard CI

on:
  push:
    branches: [main]
    paths:
      - "web-dashboard/**"
      - "supabase/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "web-dashboard/**"
      - "supabase/**"
      - ".github/workflows/web-ci.yml"

jobs:
  verify-web:
    name: Typecheck, Unit Tests & Next.js Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run Vitest unit & integration tests
        run: npm test

      - name: Build production Next.js bundle
        run: npm run build
